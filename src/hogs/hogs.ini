; Settings for the Hogs of War fix (ddraw.dll). Restart the game after a change.

[Display]
; 1 = full screen: a borderless window over the whole monitor (Alt+Tab is safe)
; 0 = a framed window, as large as fits the screen; it keeps the size you give it
Borderless=0
; 1 = the framed window can be resized and maximized
Resizable=1
; 1 = on a monitor wider than 4:3, battles run in a resolution of its shape (16:9, 21:9...):
;     they fill the screen and show more to the sides.
;     Menus and videos stay 4:3, with black bars.
; 0 = 4:3 resolutions only
Widescreen=1

[Startup]
; 1 = start without the launcher window, with the resolution chosen last time.
;     The first start takes the largest one for your monitor.
;     Hold Shift while the game starts to choose again: fewer lines give a larger HUD,
;     and the picture stays as sharp (see Scale).
SkipLauncher=1
; 1 = skip the logo and the intro videos at start
SkipIntro=1

[Battle]
; Frames per second in a battle. The game itself still makes 25 steps per second, at its
; original speed; the frames in between show everything on its way from one step to the next.
; 0 = as many as the monitor shows (60, 144, ...), 25 or less = as the original game,
; a higher number = that many, but no more than the monitor shows while VSync=1
FrameRate=0
; 0 = the frames in between repeat the last step: no smoothing (to find the cause of a glitch)
Interpolation=1
; 1 = computer pigs walk on their turn. In the original PC game they stayed where they were:
;     their path finder never ran.
ComputerWalks=1

[Gamepad]
; 1 = Xbox controllers (and other XInput gamepads) work without setup, with the buttons of the
;     PlayStation version in the same places:
;     D-pad or left stick  move, aim, menus             A (cross)     fire, select
;     B (circle)           weapon menu, back            X (square)    jump
;     Y (triangle)         enter and leave vehicles, back
;     LB (L1)              hold for the look-around camera and fine aim
;     RB or right stick up            aim higher        (both also switch
;     RT or right stick down          aim lower          to another pig)
;     Start                pause                        Back          (select)
;     In a battle a button presses the key set for it in Options, Controls.
; 0 = the game's own joystick support handles them, as before
XInput=1
; How far the left stick of such a controller must be pushed to count, in percent
XInputDeadzone=30
; Other joysticks, set up in Options, Controls: stick dead zone in percent of the stick travel
; (the original game used 50)
Deadzone=15

[Render]
; Used by the built-in renderer (ddraw.dll from this fix, Direct3D 11).
; Internal resolution = game resolution x Scale.
; 0 = enough to cover the monitor; the picture is then scaled down, with smooth edges.
Scale=0
; 1 = show every frame on a monitor refresh: the smoothest motion, and no more frames than the
;     monitor can show
; 0 = do not wait for the monitor; frames are timed by a clock only
VSync=1
; How far the fog is, in percent of the original distance. 200 = you see twice as far.
FogDistance=100

[Network]
; Network games over the internet (Multi-player, Network). The game itself finds other players only
; on a local network or by an IP address. With a lobby server set here, its Network menu shows the
; games on that server instead: one player makes a game, the others see it in the list and join.
; All players need the same version of this fix and the same [Battle] ComputerWalks setting.
; The list of games shows the players of each game and your ping to the server.
; Server = the lobby server, in one of two forms:
;            name or name:port   a direct connection; the port is 47800 if not given
;            wss://name          a web address (WebSocket), for a server behind a web front
; empty  = the game's own network play
Server=
; Your name in network games: up to 15 Latin letters, digits, spaces and hyphens.
; empty = PLAYER and a number
Name=
; A word that you and your friends share: only players with the same word see your games, and you
; see only theirs. It keeps strangers out of your list; it is not a strong lock.
; empty = games open to everyone
Password=
