; Settings for the Hogs of War fix (hogs.dll and ddraw.dll). Restart the game after a change.

[Display]
; 1 = play in a normal framed window (no display mode switch, Alt+Tab is safe)
; 0 = the game's original fullscreen mode (not supported by the built-in renderer)
Windowed=1
; 1 = the window can be resized and maximized (needs Windowed=1)
Resizable=1
; 1 = a borderless window over the whole monitor, like fullscreen (needs Windowed=1)
; 0 = a framed window, as large as fits the screen; it keeps the size you give it
Borderless=0

[Startup]
; 1 = start with the resolution chosen last time, without the launcher window.
;     Hold Shift while the game starts to choose again.
SkipLauncher=1
; 1 = skip the logo and the intro videos at start
SkipIntro=1

[Gamepad]
; Stick dead zone in percent of the stick travel (the original game used 50)
Deadzone=15

[Render]
; Used by the built-in renderer (ddraw.dll from this fix, Direct3D 11).
; Internal resolution = game resolution x Scale.
; 0 = enough to cover the monitor; the picture is then scaled down, with smooth edges.
Scale=0
; 1 = wait for the monitor refresh (smooth, like the original fullscreen mode)
VSync=1
